<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-4xl w-full bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col lg:flex-row h-[600px]">

    <!-- Colonne Logo (gauche) -->
    <div class="hidden lg:block lg:w-1/2 h-full">
      <img
        src="images/home/logo.png"
        alt="Logo"
        class="w-full h-full object-cover"
      />
    </div>

    <!-- Colonne Formulaire (droite) -->
    <div class="w-full lg:w-1/2 p-8 flex flex-col items-center justify-center">

      <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">
        Connexion
      </h2>

      <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" class="w-full space-y-6 max-w-md">

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            required
            placeholder="email@example.com"
            class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Mot de passe
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            required
            placeholder="••••••••"
            class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>

        <button
          type="submit"
          class="w-full flex justify-center py-3 px-4 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        >
          Se connecter
        </button>

        <p *ngIf="errorMessage" class="text-red-600 text-center text-sm mt-2">
          {{ errorMessage }}
        </p>

      </form>

      <div class="mt-8 text-center text-gray-500 text-sm">
        <p>
          Pas encore de compte ?
          <a href="#" class="text-blue-600 hover:underline font-medium">Inscrivez-vous</a>
        </p>
      </div>
    </div>

  </div>
</div>
