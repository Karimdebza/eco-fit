<div class="min-h-screen bg-surface py-10 px-4">

  <!-- Loader -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <div class="w-10 h-10 rounded-full border-4 border-accent border-t-transparent animate-spin"></div>
  </div>

  <div *ngIf="!isLoading" class="max-w-3xl mx-auto">

    <!-- Card principale -->
    <div class="bg-white rounded-2xl shadow-card overflow-hidden">

      <!-- Bandeau header -->
      <div class="bg-primary h-28 relative">
        <div class="absolute -bottom-12 left-1/2 -translate-x-1/2">
          <div class="relative group">
            <img
              [src]="previewUrl || 'https://robohash.org/default?size=200x200'"
              alt="Avatar"
              class="w-24 h-24 rounded-full border-4 border-white object-cover shadow-card"
            />
            <!-- Badge édition avatar -->
            <label *ngIf="isEditing"
              class="absolute inset-0 flex items-center justify-center rounded-full bg-ink/50 cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden" />
            </label>
          </div>
        </div>
      </div>

      <!-- Nom + email -->
      <div class="pt-16 pb-6 text-center px-6">
        <h1 class="font-display text-2xl font-bold text-ink">
          {{ userData.first_name }} {{ userData.last_name }}
        </h1>
        <p class="text-ink-muted text-sm mt-1">{{ userData.email }}</p>
      </div>

      <!-- Formulaire -->
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="px-6 pb-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

          <!-- Prénom -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Prénom</label>
            <input type="text" formControlName="first_name"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Nom -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Nom</label>
            <input type="text" formControlName="last_name"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Téléphone -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Téléphone</label>
            <input type="text" formControlName="number_of_phone"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Âge -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Âge</label>
            <input type="number" formControlName="age"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Taille -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Taille (cm)</label>
            <input type="number" formControlName="height"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Pointure -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Pointure</label>
            <input type="number" formControlName="size"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

          <!-- Situation / Profession -->
          <div class="flex flex-col gap-1 sm:col-span-2">
            <label class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Situation / Profession</label>
            <input type="text" formControlName="disability_type"
              class="bg-surface-muted text-ink rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200
                     border border-transparent focus:border-accent focus:bg-white
                     disabled:opacity-60 disabled:cursor-not-allowed" />
          </div>

        </div>

        <!-- Actions -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-3">

          <!-- Déconnexion -->
          <button type="button" (click)="logout()"
            class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 rounded-xl
                   text-sm font-semibold text-energy-dark border border-energy-dark/30
                   hover:bg-energy-dark/10 transition-all duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Déconnexion
          </button>

          <!-- Modifier / Enregistrer -->
          <div class="w-full sm:w-auto flex gap-3">
            <button *ngIf="isEditing" type="button" (click)="toggleEdit()"
              class="flex-1 sm:flex-none px-6 py-3 rounded-xl text-sm font-semibold text-ink-muted
                     border border-ink-muted/30 hover:bg-surface-muted transition-all duration-200">
              Annuler
            </button>

            <button *ngIf="!isEditing" type="button" (click)="toggleEdit()"
              class="flex-1 sm:flex-none px-8 py-3 rounded-xl text-sm font-bold text-white
                     bg-accent hover:bg-accent-dark transition-all duration-200 shadow-sm">
              Modifier
            </button>

            <button *ngIf="isEditing" type="submit"
              class="flex-1 sm:flex-none px-8 py-3 rounded-xl text-sm font-bold text-white
                     bg-primary hover:bg-primary-light transition-all duration-200 shadow-sm">
              Enregistrer
            </button>
          </div>

        </div>
      </form>

    </div>
  </div>
</div>
