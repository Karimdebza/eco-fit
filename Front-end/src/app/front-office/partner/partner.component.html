<!-- Header page -->
<div class="bg-surface-muted border-b border-surface-muted">
  <div class="max-w-7xl mx-auto px-6 py-10">
    <div class="flex items-center gap-2 mb-1">
      <span class="text-3xl">🤝</span>
      <h1 class="font-display text-3xl font-bold text-ink">Partenaires</h1>
    </div>
    <p class="text-ink/50 text-sm">Des partenaires engagés dans une démarche éco-responsable.</p>
  </div>
</div>

<div class="max-w-7xl mx-auto px-6 py-8">

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20 gap-4">
    <div class="w-10 h-10 rounded-full border-4 border-surface-muted border-t-accent animate-spin"></div>
    <p class="text-ink/50 text-sm">Chargement des partenaires...</p>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && partners.length === 0" class="text-center py-20">
    <div class="text-6xl mb-4">🌱</div>
    <p class="font-display text-xl font-bold text-ink mb-2">Aucun partenaire pour le moment</p>
    <p class="text-ink/50 text-sm">Nos partenaires éco-responsables arrivent bientôt.</p>
  </div>

  <!-- Grille partenaires -->
  <div *ngIf="!isLoading && partners.length > 0"
       class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let partner of partners"
         class="group bg-white rounded-2xl shadow-card hover:shadow-hover overflow-hidden
                transition-all duration-300 hover:-translate-y-1 flex flex-col">

      <!-- Image -->
      <div class="h-44 bg-surface-muted overflow-hidden flex items-center justify-center p-6">
        <img *ngIf="partner.url_of_image" [src]="partner.url_of_image" [alt]="partner.name"
             class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-500"/>
        <div *ngIf="!partner.url_of_image" class="text-5xl">🏢</div>
      </div>

      <!-- Contenu -->
      <div class="p-5 flex flex-col flex-grow">
        <h3 class="font-display font-bold text-ink text-lg mb-2">{{ partner.name }}</h3>
        <p class="text-ink/60 text-sm leading-relaxed flex-grow mb-4">{{ partner.description }}</p>

        <!-- Eco score -->
        <div class="flex items-center justify-between pt-3 border-t border-surface-muted">
          <div class="flex items-center gap-2">
            <span class="text-sm">🌱</span>
            <span class="text-xs font-semibold text-ink/60">Eco score</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="h-2 w-24 bg-surface-muted rounded-full overflow-hidden">
              <div class="h-full bg-accent rounded-full transition-all duration-500"
                   [style.width.%]="(partner.eco_score / 10) * 100"></div>
            </div>
            <span class="text-xs font-bold text-accent ml-1">{{ partner.eco_score }}/10</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
