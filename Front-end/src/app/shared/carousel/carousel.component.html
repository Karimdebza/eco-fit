<div
  class="relative overflow-hidden"
  (mouseenter)="autoplay = false"
  (mouseleave)="autoplay = true"
>
  <div class="relative h-[80vh] min-h-[500px]">
    <div *ngFor="let slide of slides; let index = index">
      <div
        *ngIf="currentSlide === index"
        class="absolute inset-0 hero-slide"
      >
        <!-- Image + overlay -->
        <div class="absolute inset-0 bg-primary-dark">
          <img
            [src]="slide.image"
            [alt]="slide.title"
            class="w-full h-full object-cover opacity-60"
            (error)="onImageError($event)"
            loading="lazy"
          />
          <!-- Gradient overlay pour lisibilité du texte -->
          <div class="absolute inset-0 bg-gradient-to-r from-primary/80 via-primary/40 to-transparent"></div>
        </div>

        <!-- Contenu slide -->
        <div class="relative h-full flex items-center">
          <div class="max-w-7xl mx-auto px-6 w-full">
            <div class="max-w-xl slide-content">
              <!-- Badge -->
              <span class="inline-block px-3 py-1 rounded-full bg-accent/20 text-accent text-xs font-semibold mb-4 backdrop-blur-sm">
                🌱 Eco-Fit
              </span>
              <h2 class="font-display text-4xl md:text-5xl lg:text-6xl font-bold text-surface mb-4 leading-tight">
                {{ slide.title }}
              </h2>
              <p class="text-surface/80 text-lg md:text-xl mb-8 leading-relaxed">
                {{ slide.description }}
              </p>
              <a
                [href]="slide.buttonUrl"
                class="inline-flex items-center gap-2 px-7 py-3.5 rounded-xl bg-energy text-surface font-bold text-sm hover:bg-energy/90 transition-all duration-200 shadow-lg hover:shadow-xl hover:-translate-y-0.5"
              >
                {{ slide.buttonText }}
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Prev -->
    <button
      (click)="prev()"
      class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 backdrop-blur-sm text-white rounded-full w-11 h-11 flex items-center justify-center z-10 transition-all duration-200 border border-white/10"
      aria-label="Slide précédent"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>

    <!-- Next -->
    <button
      (click)="next()"
      class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/50 backdrop-blur-sm text-white rounded-full w-11 h-11 flex items-center justify-center z-10 transition-all duration-200 border border-white/10"
      aria-label="Slide suivant"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Dots -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-2 z-10">
      <button
        *ngFor="let slide of slides; let i = index"
        (click)="goTo(i)"
        class="rounded-full transition-all duration-300"
        [ngClass]="{
          'w-8 h-2.5 bg-accent': currentSlide === i,
          'w-2.5 h-2.5 bg-white/40 hover:bg-white/70': currentSlide !== i
        }"
        [attr.aria-label]="'Aller au slide ' + (i + 1)"
      ></button>
    </div>
  </div>
</div>
