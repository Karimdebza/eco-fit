<div class="relative w-full max-w-2xl mx-auto">
  <div class="relative flex items-center">
    <svg class="absolute left-4 h-5 w-5 text-ink/40 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
      (input)="onInputChange()"
      type="text"
      [placeholder]="placeholder"
      class="w-full pl-12 pr-28 py-3.5 rounded-2xl border border-surface-muted bg-white text-ink text-sm shadow-card
             focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent transition-all duration-200
             placeholder:text-ink/30"
    />
    <button
      (click)="onSearch()"
      class="absolute right-2 px-5 py-2 rounded-xl bg-primary text-surface text-sm font-semibold
             hover:bg-primary-light transition-colors duration-200"
    >
      Rechercher
    </button>
  </div>
</div>
