stages:
  - install
  - lint
  - test
  - build
  - sonar

variables:
  NODE_ENV: test
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: 0

before_script:
  - |
    echo "👉 CI sur branche : $CI_COMMIT_REF_NAME"


install_backend:
  image: node:23
  stage: install
  script:
    - cd Back-end
    - npm install
  only:
    - dev
    - main

# lint_backend:
#   image: node:23
#   stage: lint
#   script:
#     - cd Back-end
#     - npm install
#     - npm run lint
#   only:
#     - dev
#     - main

test_backend:
  image: node:23
  stage: test
  script:
    - cd Back-end
    - npm ci
    - npm run test -- --watch=false --passWithNoTests
  only:
    - dev
    - main

build_backend:
  image: node:23
  stage: build
  script:
    - cd Back-end
    - npm ci
    - npm run build
  only:
    - dev
    - main

sonarqube_analysis_backend:
  stage: sonar
  image: node:18
  services:
    - name: sonarqube:9.9-community
      alias: sonarqube
  variables:
    SONAR_HOST_URL: http://sonarqube:9000
  before_script:
    - apt-get update && apt-get install -y unzip curl jq
    - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
    - unzip sonar-scanner.zip -d $CI_PROJECT_DIR
    - export PATH="$CI_PROJECT_DIR/sonar-scanner-5.0.1.3006-linux/bin:$PATH"
    - echo "⏳ Attente que SonarQube soit UP..."
    - |
      MAX_WAIT=600
      WAITED=0
      until curl -s $SONAR_HOST_URL/api/system/health | jq -r '.status' | grep -q "UP" || [ $WAITED -ge $MAX_WAIT ]; do
        echo "SonarQube n'est pas prêt, réessayer dans 10 secondes..."
        sleep 10
        WAITED=$((WAITED + 10))
      done
      if [ $WAITED -ge $MAX_WAIT ]; then
        echo "Délai d'attente dépassé : SonarQube n'est pas UP."
        exit 1
      fi
  script:
    - cd Back-end
    - sonar-scanner \
        -Dsonar.projectKey=eco-fit-backend \
        -Dsonar.projectName="Eco-Fit Back-end" \
        -Dsonar.sources=src \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN
  only:
    - dev
    - main
